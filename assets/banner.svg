<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1622"/>
      <stop offset="0.55" stop-color="#12243a"/>
      <stop offset="1" stop-color="#1c2e0f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd76a" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffd76a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f5c14a"/>
      <stop offset="0.5" stop-color="#ffe9a3"/>
      <stop offset="1" stop-color="#f5c14a"/>
    </linearGradient>
    <mask id="imgFade">
      <linearGradient id="fadeGrad" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
        <stop offset="0.42" stop-color="#ffffff" stop-opacity="0"/>
        <stop offset="0.62" stop-color="#ffffff" stop-opacity="1"/>
        <stop offset="1" stop-color="#ffffff" stop-opacity="1"/>
      </linearGradient>
      <rect x="760" y="0" width="440" height="340" fill="url(#fadeGrad)"/>
    </mask>
    <linearGradient id="imgTint" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#12243a" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#12243a" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.25"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="340" fill="url(#bg)"/>
  <circle cx="330" cy="165" r="250" fill="url(#glow)" opacity="0.16"/>
  <rect x="0" y="330" width="1200" height="10" fill="url(#gold)" opacity="0.85"/>

  <image x="760" y="0" width="440" height="340" preserveAspectRatio="xMidYMid slice"
         href="sun-photo.jpg" mask="url(#imgFade)"/>
  <rect x="760" y="0" width="440" height="340" fill="url(#imgTint)"/>

  <text x="60" y="152" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="96" font-weight="900">
    <tspan fill="#ffe9a3">孙割</tspan><tspan fill="#ffffff">的营销宇宙</tspan>
  </text>

  <text x="62" y="200" font-family="Arial,'Segoe UI',sans-serif" font-size="22" fill="#9fb4c8" letter-spacing="5">SUN YUCHEN · 讽刺戏仿 PERSONA SKILL</text>
  <line x1="62" y1="222" x2="330" y2="222" stroke="url(#gold)" stroke-width="3" opacity="0.8"/>

  <text x="62" y="262" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="28" fill="#ffe9a3">让故事先姓孙，割完记得翻篇。</text>
  <text x="62" y="300" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" fill="#7f95ab">全人类的定语 · 精确到分的数字 · 620 万美元的香蕉哲学</text>

  <g fill="#ffd76a" opacity="0.85">
    <circle cx="470" cy="78" r="6"/><circle cx="540" cy="120" r="3.5"/>
    <circle cx="640" cy="90" r="5"/><circle cx="700" cy="140" r="3"/>
    <circle cx="120" cy="110" r="4"/><circle cx="430" cy="230" r="4"/>
  </g>
</svg>
